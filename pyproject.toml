[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oribi"
version = "0.3.0"
description = "Evidence-backed analytical context for pandas DataFrames"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oribi contributors" }]
keywords = ["pandas", "data-profiling", "data-analysis", "data-quality", "analytics"]
dependencies = ["pandas>=1.5.3,<4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/samhoon000/Oribi"
Repository = "https://github.com/samhoon000/Oribi"
Issues = "https://github.com/samhoon000/Oribi/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=6",
  "build>=1.2",
  "ruff>=0.8",
  "mypy>=1.13",
  "pandas-stubs>=2",
]

[tool.setuptools.packages.find]
include = ["oribi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["oribi"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
